<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Modern Task Manager</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- Application Logic -->
  <script src="app.js" defer></script>
</head>
<body>

  <div class="app-container">
    <!-- App Header -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">⚡</span>
        <h1>TaskFlow</h1>
      </div>
      <p class="tagline">Organize your work, streamline your day</p>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">

      <!-- New Task Form -->
      <section class="card form-section">
        <form id="task-form" autocomplete="off">
          <div class="input-group">
            <input 
              type="text" 
              id="task-input" 
              placeholder="What needs to be done?" 
              required 
            />
            <select id="priority-select" aria-label="Task Priority">
              <option value="medium">Medium Priority</option>
              <option value="high">High Priority</option>
              <option value="low">Low Priority</option>
            </select>
            <button type="submit" class="btn btn-primary" id="add-btn">
              <span>Add Task</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Filter Controls & Search -->
      <section class="controls-section">
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">All</button>
          <button class="tab-btn" data-filter="active">Active</button>
          <button class="tab-btn" data-filter="completed">Completed</button>
        </div>

        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search tasks..." />
        </div>
      </section>

      <!-- Task List Container -->
      <section class="card list-section">
        <ul id="task-list" class="task-list">
          <!-- Tasks will be dynamically rendered here via JavaScript -->
        </ul>

        <!-- Empty State Message -->
        <div id="empty-state" class="empty-state">
          <p class="empty-title">No tasks found</p>
          <p class="empty-subtitle">Add a new task above to get started!</p>
        </div>
      </section>

      <!-- Stats Bar & Actions -->
      <footer class="stats-bar">
        <span id="items-left">0 tasks remaining</span>
        <button id="clear-completed-btn" class="btn-link">Clear Completed</button>
      </footer>

    </main>
  </div>

</body>
</html>
